<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — Customer Support AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    .landing {
      position: relative;
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .landing-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(35, 134, 54, 0.12) 0%, transparent 55%),
                  radial-gradient(ellipse 60% 40% at 80% 80%, rgba(88, 166, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .landing-content {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }
    .landing h1 {
      font-size: clamp(2.25rem, 5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--text-strong);
      margin-bottom: 1rem;
    }
    .landing .tagline {
      font-size: 1.125rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .landing-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .landing-actions .btn {
      min-width: 160px;
    }
  </style>
</head>
<body class="app-shell">
  <nav class="app-nav">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Support
    </a>
    <div class="nav-links">
      <a href="/submit">Submit ticket</a>
      <a href="/chat">Live chat</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="landing">
      <div class="landing-bg" aria-hidden="true"></div>
      <div class="landing-content">
        <h1>We're here to help</h1>
        <p class="tagline">Get an AI-powered response to your request, start a live chat, or sign in to view your tickets.</p>
        <div class="landing-actions">
          <a href="/submit" class="btn btn-primary">Submit a ticket</a>
          <a href="/chat" class="btn btn-secondary">Live chat</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
