<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Chat — Customer Support AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    .chat-wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem; height: calc(100vh - 52px); display: flex; flex-direction: column; }
    .chat-header { flex-shrink: 0; margin-bottom: 1rem; }
    .chat-header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); }
    .setup-card.hidden { display: none; }
    .chat-panel { flex: 1; display: none; flex-direction: column; min-height: 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
    .chat-panel.visible { display: flex; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 85%; padding: 0.85rem 1.1rem; border-radius: var(--radius-lg); font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--accent-blue-subtle); border: 1px solid var(--border); }
    .msg.assistant { align-self: flex-start; background: var(--bg-elevated); border: 1px solid var(--border); }
    .msg .role-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.35rem; }
    .chat-form { flex-shrink: 0; padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; align-items: flex-end; background: var(--bg-elevated); }
    .chat-form textarea { flex: 1; min-height: 48px; margin-bottom: 0; resize: none; }
    .chat-form .btn { flex-shrink: 0; }
    .channel-id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .setup-error { margin-top: 0.75rem; }
  </style>
</head>
<body class="app-shell">
  <nav class="app-nav">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Support
    </a>
    <div class="nav-links">
      <a href="/submit">Submit ticket</a>
      <a href="/chat" class="active">Live chat</a>
      <a href="/login">Log in</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="chat-wrap">
      <div class="chat-header">
        <h1>Support Chat</h1>
        <a href="/submit" class="btn btn-ghost" style="padding: 0.4rem 0;">← Back to tickets</a>
      </div>

      <div class="card setup-card" id="setup">
        <div class="channel-id" id="channel-id" style="display: none;"></div>
        <label for="chat-email">Your email</label>
        <input type="email" id="chat-email" placeholder="you@example.com" required>
        <label for="chat-subject">Topic (optional)</label>
        <input type="text" id="chat-subject" placeholder="e.g. Billing question">
        <label for="chat-first">First message (optional)</label>
        <textarea id="chat-first" placeholder="Type your message to start the conversation…"></textarea>
        <button type="button" class="btn btn-primary" id="start-chat-btn">Start chat</button>
        <div class="error-box setup-error" id="setup-error"></div>
      </div>

      <div class="chat-panel" id="chat-panel">
        <div class="chat-messages" id="messages"></div>
        <form class="chat-form" id="chat-form">
          <textarea id="msg-input" placeholder="Type a message…" rows="1" required></textarea>
          <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    let channelId = null;

    const setupEl = document.getElementById('setup');
    const chatPanelEl = document.getElementById('chat-panel');
    const messagesEl = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const startBtn = document.getElementById('start-chat-btn');
    const setupErrorEl = document.getElementById('setup-error');
    const channelIdEl = document.getElementById('channel-id');

    function showError(el, text) {
      el.textContent = text || '';
      el.classList.toggle('visible', !!text);
    }

    function appendMessage(role, content) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const label = role === 'user' ? 'You' : 'Support';
      div.innerHTML = '<div class="role-label">' + label + '</div>' + escapeHtml(content);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    async function startChat() {
      const email = document.getElementById('chat-email').value.trim();
      if (!email) {
        showError(setupErrorEl, 'Please enter your email.');
        return;
      }
      showError(setupErrorEl, '');
      startBtn.disabled = true;
      startBtn.innerHTML = '<span class="spinner"></span> Starting…';

      const payload = {
        customer_email: email,
        subject: document.getElementById('chat-subject').value.trim() || null,
        initial_message: document.getElementById('chat-first').value.trim() || null,
      };
      if (!payload.initial_message) delete payload.initial_message;
      if (!payload.subject) delete payload.subject;

      try {
        const res = await fetch('/channels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || res.statusText || 'Failed to start chat');
        channelId = data.channel_id;
        channelIdEl.textContent = 'Channel #' + channelId;
        channelIdEl.style.display = 'block';
        setupEl.classList.add('hidden');
        chatPanelEl.classList.add('visible');
        messagesEl.innerHTML = '';
        (data.messages || []).forEach(m => appendMessage(m.role, m.content));
        if (!data.messages || data.messages.length === 0) msgInput.focus();
      } catch (err) {
        showError(setupErrorEl, err.message || 'Could not start chat.');
      } finally {
        startBtn.disabled = false;
        startBtn.textContent = 'Start chat';
      }
    }

    startBtn.addEventListener('click', startChat);

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = msgInput.value.trim();
      if (!content || !channelId) return;
      msgInput.value = '';
      sendBtn.disabled = true;
      appendMessage('user', content);
      sendBtn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await fetch('/channels/' + channelId + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || res.statusText || 'Send failed');
        appendMessage('assistant', data.assistant_message || '');
      } catch (err) {
        appendMessage('assistant', 'Sorry, we could not get a response: ' + (err.message || 'Please try again.'));
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
        msgInput.focus();
      }
    });
  </script>
</body>
</html>
