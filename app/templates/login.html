<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Customer Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    .login-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 52px); padding: 1.5rem; }
    .login-card { width: 100%; max-width: 400px; }
    .login-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; letter-spacing: -0.02em; color: var(--text-strong); }
    .login-card .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .login-card .links { margin-top: 1.5rem; text-align: center; }
    .login-card .links a { color: var(--text-muted); font-size: 0.9rem; text-decoration: none; }
    .login-card .links a:hover { color: var(--accent-blue); }
  </style>
</head>
<body class="app-shell">
  <nav class="app-nav">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Support
    </a>
    <div class="nav-links">
      <a href="/">Submit ticket</a>
      <a href="/chat">Live chat</a>
      <a href="/login" class="active">Log in</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="login-page">
      <div class="card login-card">
        <h1>Customer login</h1>
        <p class="subtitle">Sign in with your email and password to view and manage your tickets.</p>
        <form id="login-form" method="post" action="/login">
          <label for="email">Email</label>
          <input type="email" id="email" name="customer_email" placeholder="you@example.com" required autocomplete="email">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Log in</button>
          <div class="error-box" id="error"></div>
        </form>
        <p class="links">Don't have an account? <a href="/register">Create one</a> · <a href="/">← Back to support</a></p>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', function(e) {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email) {
        e.preventDefault();
        errorEl.innerHTML = 'Please enter your email.';
        errorEl.classList.add('visible');
        return;
      }
      if (!password) {
        e.preventDefault();
        errorEl.innerHTML = 'Please enter your password.';
        errorEl.classList.add('visible');
        return;
      }
      errorEl.classList.remove('visible');
      errorEl.innerHTML = '';
      form.submit();
    });
  </script>
</body>
</html>
