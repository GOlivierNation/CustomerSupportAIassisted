# Render Blueprint – Customer Support AI
# https://docs.render.com/blueprint-spec
services:
  - type: web
    name: customersupportaiassisted
    runtime: python
    # Use repo root (no rootDirectory) – app/ and requirements.txt are here
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPERUSER_EMAILS
        sync: false
